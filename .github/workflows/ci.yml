name: CI — 总门禁检查

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  gate-check:
    name: 总门禁检查
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 安装依赖
        run: npm ci --legacy-peer-deps

      - name: 运行总门禁脚本
        run: npx tsx scripts/gate-check.ts

      - name: 上传构建产物（可选）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            .next/
            !.next/cache/
